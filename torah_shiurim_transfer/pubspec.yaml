name: torah_shiurim_transfer
description: "A secure transfer system for Torah shiurim recordings."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  device_manager: ^0.0.7
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  virtual_keyboard_custom_layout: ^1.0.1
  drift: ^2.17.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.0.0+1
  go_router: ^13.2.4
  freezed_annotation: ^2.4.1
  disk_space: ^0.2.1
  kosher_dart: ^2.0.17
  material_hebrew_date_picker: ^1.2.2
  virtual_keyboard_multi_language: ^1.0.0
  ffi: ^2.0.2

  # תלויות לניהול חלון ומגש מערכת
  window_manager: ^0.4.3
  tray_manager: ^0.5.0

  # --- הוספת תלות חדשה ---
  # מאפשר קריאות ישירות ל-Win32 API כדי לכפות חלון לחזית
  win32: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.17.0
  freezed: ^2.5.2

# הפתרון להתנגשות הגרסאות:
# כופה על כל החבילות להשתמש בגרסה זו של intl
dependency_overrides:
  intl: 0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico