name: torah_shiurim_transfer
description: "A secure transfer system for Torah shiurim recordings."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  drift: ^2.17.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.0.0+1
  go_router: ^13.2.4
  intl: ^0.19.0
  # הוספת התלות החסרה
  freezed_annotation: ^2.4.1
  disk_space: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.17.0
  # הוספת התלות החסרה
  freezed: ^2.5.2

flutter:
  uses-material-design: true