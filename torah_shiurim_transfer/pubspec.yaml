name: torah_shiurim_transfer
description: "A secure transfer system for Torah shiurim recordings."
publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# --- zależności ראשיות ---
dependencies:
  flutter:
    sdk: flutter
  
  # ברירת מחדל
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Database (Drift ORM)
  drift: ^2.17.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # File & Directory Picking
  file_picker: ^8.0.0+1

  # Navigation
  go_router: ^13.2.4

  # Formatting
  intl: ^0.19.0

# --- zależności פיתוח ---
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Drift code generation
  build_runner: ^2.4.9
  drift_dev: ^2.17.0

flutter:
  uses-material-design: true