# build.yaml
# קובץ זה מגדיר ל-build_runner איזה מחולל קוד להפעיל על אילו קבצים.
# זה מונע קונפליקטים בין מחוללים שונים (כמו drift ו-freezed).

targets:
  $default:
    builders:
      # הגדרות עבור freezed (שמשתמש ב-source_gen)
      source_gen|combining_builder:
        options:
          # זו הגדרה טכנית שמבטיחה שהפלט של freezed יהיה נכון
          build_extensions:
            '^lib/{{}}.dart': 'lib/{{}}.freezed.dart'
        # ההגדרה החשובה ביותר: הנחיה להריץ את המחולל הזה *רק* על הקבצים הרלוונטיים.
        generate_for:
          - lib/models/app_user.dart

      # הגדרות עבור drift
      drift_dev:
        # הנחיה להריץ את המחולל הזה *רק* על קבצים המכילים הגדרות מסד נתונים.
        generate_for:
          - lib/core/database/database.dart