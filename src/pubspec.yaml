name: kol_hashiurim
description: "A secure transfer system for Torah shiurim recordings."
publish_to: 'none'
version: 0.2.2+4

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  device_manager: ^0.0.7
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.6.1
  virtual_keyboard_custom_layout: ^1.0.1
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^10.3.10
  go_router: ^17.1.0
  freezed_annotation: ^3.1.0
  disk_space: ^0.2.1
  kosher_dart: ^2.0.18
  material_hebrew_date_picker: ^1.2.2
  virtual_keyboard_multi_language: ^1.1.2
  ffi: ^2.1.5
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  win32: ^5.15.0
  pointycastle: ^4.0.0
  basic_utils: ^5.8.2
  windows_system_info: ^0.0.4
  canonical_json: ^1.1.2
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.11.0
  drift_dev: ^2.31.0
  freezed: ^3.2.5
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  intl: 0.20.2
  just_audio_windows:
    path: third_party/just_audio_windows

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico
    - assets/keys/public.pem
    - assets/bin/Volumeid.exe
