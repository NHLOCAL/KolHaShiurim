# File: .github/workflows/build-and-release.yml
name: Build Shiur-Bot Windows

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Install dependencies
        working-directory: torah_shiurim_transfer
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: torah_shiurim_transfer
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Windows executable
        working-directory: torah_shiurim_transfer
        run: flutter build windows --release

      - name: Package Release
        working-directory: torah_shiurim_transfer/build/windows/runner/Release
        run: zip -r ../../../shiur-bot-windows-${{ github.ref_name || github.sha }}.zip *
        shell: bash

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiur-bot-windows
          path: torah_shiurim_transfer/build/windows/runner/shiur-bot-windows-${{ github.ref_name || github.sha }}.zip
