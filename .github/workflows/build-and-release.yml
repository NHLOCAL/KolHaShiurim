# File: .github/workflows/build-and-release.yml
name: Build Shiur-Bot Windows

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    defaults:
      run:
        working-directory: torah_shiurim_transfer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            torah_shiurim_transfer/.dart_tool
            torah_shiurim_transfer/.packages
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Windows executable
        run: flutter build windows --release

      # --- התיקון כאן ---
      - name: Package Release with PowerShell
        run: |
          Compress-Archive -Path build/windows/runner/Release/* -DestinationPath shiur-bot-windows-${{ github.ref_name }}.zip
        # אין צורך ב-shell: bash, משתמשים ב-PowerShell שמהווה ברירת מחדל

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiur-bot-windows
          path: torah_shiurim_transfer/shiur-bot-windows-${{ github.ref_name }}.zip