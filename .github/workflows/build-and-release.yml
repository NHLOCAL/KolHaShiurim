# File: .github/workflows/build-and-release.yml
name: Build Shiur-Bot Windows

on:
  push:
    branches:
      - main
      - dev
      - fix-bugs
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            src/.dart_tool
            src/.packages
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Run flutter clean
        run: flutter clean
        working-directory: src

      - name: Install dependencies
        run: flutter pub get
        working-directory: src

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs
        working-directory: src

      - name: Build Windows executable
        run: flutter build windows --release
        working-directory: src

      - name: Verify generated_config.cmake exists
        run: dir windows/flutter
        working-directory: src

      - name: Package Release with PowerShell
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath shiur-bot-windows-${{ github.ref_name }}.zip -Force
        working-directory: src

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiur-bot-windows
          path: src/shiur-bot-windows-${{ github.ref_name }}.zip
