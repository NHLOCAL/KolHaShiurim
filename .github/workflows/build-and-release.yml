# File: .github/workflows/build-and-release.yml
name: Build Shiur-Bot and Release

on:
  push:
    branches:
      - main
      - dev
      - release/*
    tags:
      - '*'
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Install Dependencies
        working-directory: torah_shiurim_transfer
        run: flutter pub get

      - name: Decode Keystore and Create Properties File
        working-directory: torah_shiurim_transfer/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > key.jks
          cat <<EOF > key.properties
          storePassword=$KEY_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$(pwd)/key.jks
          EOF

      - name: Build Signed Android APK
        working-directory: torah_shiurim_transfer
        run: flutter build apk --release --flavor production --dart-define=BOT_NAME=Shiur-Bot

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiur-bot-android-apk
          path: torah_shiurim_transfer/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Install Dependencies
        working-directory: torah_shiurim_transfer
        run: flutter pub get

      - name: Build Windows EXE
        working-directory: torah_shiurim_transfer
        run: flutter build windows --release --target-name Shiur-Bot

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiur-bot-windows-zip
          path: torah_shiurim_transfer/build/windows/runner/Release

  release:
    name: Create GitHub Release
    needs:
      - android
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: shiur-bot-android-apk
          path: artifacts/android

      - name: Download Windows ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: shiur-bot-windows-zip
          path: artifacts/windows

      - name: Prepare Release Assets and Rename
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          mv artifacts/android/app-release.apk artifacts/android/shiur-bot-${TAG_VERSION}.apk
          mv artifacts/windows/runner/Release artifacts/windows/shiur-bot-${TAG_VERSION}-windows.zip
          echo "Final files for release:"
          ls -R artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android/shiur-bot-${{ github.ref_name }}.apk
            artifacts/windows/shiur-bot-${{ github.ref_name }}-windows.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} of Shiur-Bot
          body: |
            גרסה ${{ github.ref_name }} של Shiur-Bot.
            קבצים מצורפים:
            - `shiur-bot-${{ github.ref_name }}.apk` (אנדרואיד)
            - `shiur-bot-${{ github.ref_name }}-windows.zip` (חלונות)
          draft: true
          prerelease: false
